name: Build Single Debian Package (Reusable)

on:
  workflow_call:
    inputs:
      package_key:
        description: Package key to build
        required: true
        type: string

concurrency:
  group: build-single-package-${{ inputs.package_key }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_CONFIGURATION: Release
  TARGET_RUNTIME: linux-arm64
  PLUGIN_TARGET_FRAMEWORK: net10.0
  INSTALL_DIRECTORY: /home/pi/pins
  PUBLISH_DIRECTORY: artifacts/publish
  PACKAGE_ROOT: artifacts/package
  DEB_ROOT: artifacts/debroot
  DEB_ARCH: arm64
  DEB_PACKAGE: pins
  PLUGINS_INSTALL_BASE: /home/pi/.local/share/NINA/Plugins/3.0.0
  PLUGIN_DEB_BASE: artifacts/plugin-debroot
  PLUGIN_ARTIFACT_DIR: artifacts/plugins
  PLUGIN_MSBUILD_ARGS: -p:DisableImplicitSystemDrawingReference=true -p:Platform=AnyCPU -p:PlatformTarget=AnyCPU -p:SatelliteResourceLanguages="en-US"

jobs:
  build:
    name: Build package ${{ inputs.package_key }}
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    permissions:
      contents: write

    steps:
      - name: Bootstrap container tooling
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            gnupg \
            wget \
            default-jre-headless \
            build-essential \
            cmake \
            git-lfs \
            zip \
            unzip \
            autoconf \
            autoconf-archive \
            libtool \
            pkg-config \
            libudev-dev \
            libjsoncpp-dev \
            libgpiod-dev \
            libssl-dev \
            libicu-dev \
            rsync

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.package_key == 'pins' }}
          submodules: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/global.json', '**/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pinsdaemon validation tooling
        if: ${{ inputs.package_key == 'pinsdaemon' }}
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv

      - name: Determine release and build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          ci_build_number=$((GITHUB_RUN_NUMBER + 299))
          release_date=$(date +%d%m%Y)
          release_tag="${{ inputs.package_key }}-v${release_date}-${ci_build_number}"

          echo "CI_BUILD_NUMBER=$ci_build_number" >> "$GITHUB_ENV"
          echo "RELEASE_DATE=$release_date" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

          echo "ci_build_number=$ci_build_number" >> "$GITHUB_OUTPUT"
          echo "release_date=$release_date" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Prepare core linux-arm64 publish payload
        if: ${{ inputs.package_key == 'pins' }}
        shell: bash
        run: |
          set -euo pipefail

          apt-get update
          apt-get install -y libudev-dev libjsoncpp-dev libgpiod-dev autoconf autoconf-archive libtool pkg-config

          wget https://mirrors.edge.kernel.org/pub/software/libs/libgpiod/libgpiod-2.2.tar.gz
          tar -xzf libgpiod-2.2.tar.gz
          cd libgpiod-2.2
          ./configure --prefix=/usr --enable-tools=yes --enable-bindings-cxx
          make
          make install
          ldconfig
          cd ..

          rm -rf NINA/External
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --branch main https://github.com/nitr57/pins.external NINA/External

          jpleph_url="https://github.com/isbeorn/nina.external/raw/refs/heads/master/JPLEPH"
          curl -L --fail --retry 3 --retry-delay 5 -o "NINA/External/JPLEPH" "$jpleph_url"

          rm -rf "NINA/External/linux-x64"
          rm -f "NINA/External/.gitignore" "NINA/External/.gitattributes"

          if [ ! -d "NINA/External/${TARGET_RUNTIME}" ]; then
            echo "NINA/External/${TARGET_RUNTIME} not found after repository clone" >&2
            exit 1
          fi

          # Rebuild NOVAS and sync generated files into the existing external layout.
          pushd NOVAS31 >/dev/null
          make clean || true
          make
          popd >/dev/null

          mkdir -p "NINA/External/${TARGET_RUNTIME}/NOVAS"
          cp -f NOVAS31/libnovas_c.so "NINA/External/${TARGET_RUNTIME}/NOVAS/libnovas_c.so"
          cp -f NOVAS31/cio_ra.bin "NINA/External/${TARGET_RUNTIME}/NOVAS/cio_ra.bin"

          if [ ! -f "NINA/External/JPLEPH" ]; then
            echo "NINA/External/JPLEPH not found" >&2
            exit 1
          fi

          # SOFA makefile builds static lib by default, so build a shared object explicitly.
          pushd SOFA/SOFA/src >/dev/null
          make clean || true
          make
          rm -f ./*.o libsofa_c.so
          for src in ./*.c; do
            if [ "$(basename "$src")" = "t_sofa_c.c" ]; then
              continue
            fi
            gcc -fPIC -O2 -c "$src"
          done
          gcc -shared -o libsofa_c.so ./*.o -lm
          popd >/dev/null

          mkdir -p "NINA/External/${TARGET_RUNTIME}/SOFA"
          cp -f SOFA/SOFA/src/libsofa_c.so "NINA/External/${TARGET_RUNTIME}/SOFA/libsofa_c.so"

          # Keep only NOVAS and SOFA under the runtime-specific external folder.
          find "NINA/External/${TARGET_RUNTIME}" -mindepth 1 -maxdepth 1 ! -name 'NOVAS' ! -name 'SOFA' -exec rm -rf {} +

          dotnet restore NINA/NINA.csproj -r "${TARGET_RUNTIME}"
          dotnet restore System.Windows.Compat/System.Windows.Compat.csproj
          dotnet build System.Windows.Compat/System.Windows.Compat.csproj -c "${BUILD_CONFIGURATION}" --no-restore
          dotnet build NINA/NINA.csproj -c "${BUILD_CONFIGURATION}" -r "${TARGET_RUNTIME}" --no-restore
          dotnet publish NINA/NINA.csproj -c "${BUILD_CONFIGURATION}" -r "${TARGET_RUNTIME}" --no-build -o "${PUBLISH_DIRECTORY}/${TARGET_RUNTIME}"

          publish_root="${PUBLISH_DIRECTORY}/${TARGET_RUNTIME}"
          mkdir -p "$publish_root/External"
          rsync -a NINA/External/ "$publish_root/External/"

      - name: Build selected package
        id: build
        shell: bash
        env:
          PACKAGE_KEY: ${{ inputs.package_key }}
        run: |
          set -euo pipefail

          package_key="${PACKAGE_KEY}"
          mkdir -p artifacts "${PLUGIN_ARTIFACT_DIR}"
          : > artifacts/release-files.txt

          get_core_version() {
            local base_version
            base_version=$(grep -m1 'AssemblyInformationalVersion' CommonAssemblyInfo.cs | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "$base_version" ]; then
              echo "Failed to determine version from CommonAssemblyInfo.cs" >&2
              return 1
            fi
            base_version=$(echo "$base_version" | sed 's/-canary/-pins-canary/')
            echo "${base_version}+${CI_BUILD_NUMBER}"
          }

          build_pins_package() {
            local package_version
            package_version=$(get_core_version)

            publish_root="${PUBLISH_DIRECTORY}/${TARGET_RUNTIME}"
            package_root="${PACKAGE_ROOT}"
            rm -rf "$package_root"
            mkdir -p "$package_root/pins"
            rsync -a "$publish_root/" "$package_root/pins/"
            echo "${INSTALL_DIRECTORY}" > "$package_root/pins/.install_path"

            compat_dll="System.Windows.Compat/bin/${BUILD_CONFIGURATION}/net10.0/System.Windows.dll"
            if [ ! -f "$compat_dll" ]; then
              echo "Compat build missing at $compat_dll" >&2
              return 1
            fi
            cp -f "$compat_dll" "$package_root/pins/System.Windows.dll"

            deb_root="${DEB_ROOT}"
            install_root="$deb_root/home/pi/pins"
            rm -rf "$deb_root"
            mkdir -p "$install_root"
            rsync -a "$package_root/pins/" "$install_root/"

            service_path="$deb_root/etc/systemd/system/pins.service"
            mkdir -p "$(dirname "$service_path")"
            cp packaging/systemd/pins.service "$service_path"
            chmod 644 "$service_path"

            control_dir="$deb_root/DEBIAN"
            mkdir -p "$control_dir"
            cp packaging/debian/postinst "$control_dir/postinst"
            cp packaging/debian/prerm "$control_dir/prerm"
            chmod 755 "$control_dir/postinst" "$control_dir/prerm"

            installed_size=$(du -sk "$deb_root/home/pi/pins" | cut -f1)
            {
              echo "Package: ${DEB_PACKAGE}"
              echo "Version: ${package_version}"
              echo "Section: misc"
              echo "Priority: optional"
              echo "Architecture: ${DEB_ARCH}"
              echo "Maintainer: PINS Team"
              echo "Installed-Size: ${installed_size}"
              echo "Description: Pins build for Raspberry Pi"
            } > "$control_dir/control"

            deb_path="artifacts/${DEB_PACKAGE}_${package_version}_${DEB_ARCH}_${RELEASE_DATE}.deb"
            dpkg-deb --root-owner-group --build "$deb_root" "$deb_path"
            sha256sum "$deb_path" > "$deb_path.sha256"

            echo "$deb_path" >> artifacts/release-files.txt
            echo "$deb_path.sha256" >> artifacts/release-files.txt
          }

          build_pinsdaemon_package() {
            rm -rf pinsdaemon
            git clone https://github.com/Touch-N-Stars/pinsdaemon pinsdaemon

            pushd pinsdaemon >/dev/null
            python3 -m venv .venv
            .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt
            .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
            bash -n scripts/*.sh scripts/pins-rig-name scripts/90-pins-wifi-recovery packaging/DEBIAN/postinst packaging/DEBIAN/prerm

            mkdir -p build/opt/pinsdaemon
            mkdir -p build/usr/local/bin
            mkdir -p build/etc/systemd/system
            mkdir -p build/etc/NetworkManager/dispatcher.d
            mkdir -p build/etc/systemd/journald.conf.d
            mkdir -p build/etc/avahi/services
            mkdir -p build/etc/sudoers.d
            mkdir -p build/home/pi/pins-scripts
            mkdir -p build/lib/udev/rules.d
            mkdir -p build/DEBIAN

            cp -r app build/opt/pinsdaemon/
            cp requirements.txt build/opt/pinsdaemon/
            cp README.md build/opt/pinsdaemon/

            cp scripts/system-upgrade.sh build/usr/local/bin/
            cp scripts/manage-samba.sh build/usr/local/bin/
            cp scripts/manage-localization.sh build/usr/local/bin/
            cp scripts/wifi-connect.sh build/usr/local/bin/
            cp scripts/pins-wifi-profile.py build/usr/local/bin/
            cp scripts/pins-wifi-viability.py build/usr/local/bin/
            cp scripts/wifi-automanage.py build/usr/local/bin/
            cp scripts/wifi-scan.py build/usr/local/bin/
            cp scripts/install-firmware.sh build/usr/local/bin/
            cp scripts/install-indi-package.sh build/usr/local/bin/
            cp scripts/ensure-required-packages.sh build/usr/local/bin/
            cp scripts/manage-plugin.sh build/usr/local/bin/
            cp scripts/collect-diagnostics.sh build/usr/local/bin/
            cp scripts/install-astap-star-database.sh build/usr/local/bin/
            cp scripts/ensure-astap-data-links.sh build/usr/local/bin/
            cp scripts/pins-wifi-watchdog.sh build/usr/local/bin/
            cp scripts/pins-rig-name build/usr/local/bin/
            cp scripts/hotspot.sh build/home/pi/pins-scripts/
            cp scripts/90-pins-wifi-recovery build/etc/NetworkManager/dispatcher.d/
            chmod 755 build/etc/NetworkManager/dispatcher.d/90-pins-wifi-recovery
            chmod 755 build/usr/local/bin/pins-wifi-profile.py
            chmod 755 build/usr/local/bin/pins-wifi-viability.py

            cp systemd/sysupdate-api.service build/etc/systemd/system/
            cp systemd/pins-wifi-watchdog.service build/etc/systemd/system/
            cp systemd/pins-wifi-watchdog.timer build/etc/systemd/system/
            cp packaging/journald-persistent.conf build/etc/systemd/journald.conf.d/90-pins-persistent.conf
            cp packaging/pinsdaemon.service build/etc/avahi/services/pinsdaemon.service

            cp packaging/zz-pins.rules build/lib/udev/rules.d/zz-pins.rules
            cp packaging/sudoers build/etc/sudoers.d/sysupdate-api

            cp packaging/DEBIAN/* build/DEBIAN/
            chmod 755 build/DEBIAN/postinst
            chmod 755 build/DEBIAN/prerm

            base_version=$(grep '^Version:' packaging/DEBIAN/control | awk '{print $2}')
            full_version="${base_version}-${CI_BUILD_NUMBER}"
            filename="pinsdaemon_${full_version}_arm64.deb"

            sed -i "s/^Version:.*/Version: ${full_version}/" build/DEBIAN/control
            dpkg-deb --root-owner-group --build build "$filename"

            required_paths=(
              ./etc/NetworkManager/dispatcher.d/90-pins-wifi-recovery
              ./etc/avahi/services/pinsdaemon.service
              ./etc/systemd/journald.conf.d/90-pins-persistent.conf
              ./etc/systemd/system/pins-wifi-watchdog.service
              ./etc/systemd/system/pins-wifi-watchdog.timer
              ./etc/systemd/system/sysupdate-api.service
              ./usr/local/bin/collect-diagnostics.sh
              ./usr/local/bin/ensure-astap-data-links.sh
              ./usr/local/bin/ensure-required-packages.sh
              ./usr/local/bin/install-astap-star-database.sh
              ./usr/local/bin/manage-localization.sh
              ./usr/local/bin/manage-plugin.sh
              ./usr/local/bin/pins-rig-name
              ./usr/local/bin/pins-wifi-profile.py
              ./usr/local/bin/pins-wifi-viability.py
              ./usr/local/bin/pins-wifi-watchdog.sh
            )
            package_contents=$(dpkg-deb --fsys-tarfile "$filename" | tar -tf -)
            for required_path in "${required_paths[@]}"; do
              if ! grep -Fxq "$required_path" <<< "$package_contents"; then
                echo "Pinsdaemon package is missing $required_path" >&2
                return 1
              fi
            done
            popd >/dev/null

            mv "pinsdaemon/${filename}" artifacts/
            sha256sum "artifacts/${filename}" > "artifacts/${filename}.sha256"
            echo "artifacts/${filename}" >> artifacts/release-files.txt
            echo "artifacts/${filename}.sha256" >> artifacts/release-files.txt
          }

          build_cmake_sdk_package() {
            local repo_url="$1"
            local repo_dir="$2"
            local deb_package="$3"
            local package_description="$4"

            local sdk_version
            sdk_version=$(get_core_version)

            rm -rf "$repo_dir"
            git clone --depth 1 "$repo_url" "$repo_dir"

            pushd "$repo_dir" >/dev/null
            mkdir -p build
            cd build
            cmake ..
            make -j"$(nproc)"
            popd >/dev/null

            local deb_root
            deb_root="artifacts/${deb_package}-debroot"
            local install_root
            install_root="$deb_root/usr/lib"
            local control_dir
            control_dir="$deb_root/DEBIAN"

            rm -rf "$deb_root"
            mkdir -p "$install_root" "$control_dir"

            mapfile -t lib_files < <(find "$repo_dir/build" -type f \( -name 'lib*.so' -o -name 'lib*.so.*' \))
            if [ ${#lib_files[@]} -eq 0 ]; then
              echo "No shared library files found under ${repo_dir}/build" >&2
              return 1
            fi

            cp -a "${lib_files[@]}" "$install_root/"

            local installed_size
            installed_size=$(du -sk "$deb_root/usr" | cut -f1)
            {
              echo "Package: ${deb_package}"
              echo "Version: ${sdk_version}"
              echo "Section: libs"
              echo "Priority: optional"
              echo "Architecture: ${DEB_ARCH}"
              echo "Maintainer: PINS Team"
              echo "Installed-Size: ${installed_size}"
              echo "Description: ${package_description}"
            } > "$control_dir/control"

            {
              echo '#!/bin/sh'
              echo 'set -e'
              echo 'exit 0'
            } > "$control_dir/postinst"
            chmod 755 "$control_dir/postinst"

            local deb_path
            deb_path="artifacts/${deb_package}_${sdk_version}_${DEB_ARCH}_${RELEASE_DATE}.deb"
            dpkg-deb --root-owner-group --build "$deb_root" "$deb_path"
            sha256sum "$deb_path" > "$deb_path.sha256"

            echo "$deb_path" >> artifacts/release-files.txt
            echo "$deb_path.sha256" >> artifacts/release-files.txt
          }

          build_wanderercoversdk_package() {
            build_cmake_sdk_package \
              "https://github.com/nitr57/WandererCoverSDK.git" \
              "WandererCoverSDK" \
              "pins-wanderercoversdk" \
              "WandererCover SDK shared library package"
          }

          build_wandererrotatorsdk_package() {
            build_cmake_sdk_package \
              "https://github.com/nitr57/WandererRotatorSDK.git" \
              "WandererRotatorSDK" \
              "pins-wandererrotatorsdk" \
              "WandererRotator SDK shared library package"
          }

          build_nitecrawlersdk_package() {
            build_cmake_sdk_package \
              "https://github.com/nitr57/NitecrawlerSDK.git" \
              "NitecrawlerSDK" \
              "pins-nitecrawlersdk" \
              "Nitecrawler SDK shared library package"
          }

          build_wandereretasdk_package() {
            build_cmake_sdk_package \
              "https://github.com/nitr57/WandererETASDK.git" \
              "WandererETASDK" \
              "pins-wandereretasdk" \
              "WandererETA SDK shared library package"
          }

          clone_selected_plugin_repo() {
            rm -rf NINA.Plugins
            mkdir -p NINA.Plugins

            case "$package_key" in
              plugin-joko)
                git clone https://github.com/nitr57/joko.nina.plugins NINA.Plugins/joko.nina.plugins
                ;;
              plugin-orbitals)
                git clone https://github.com/nitr57/NINA.Joko.Plugin.Orbitals NINA.Plugins/NINA.Joko.Plugin.Orbitals
                ;;
              plugin-tenmicron)
                git clone https://github.com/nitr57/NINA.Joko.Plugin.TenMicron NINA.Plugins/NINA.Joko.Plugin.TenMicron
                ;;
              plugin-livestack)
                git clone https://github.com/nitr57/nina.plugin.livestack NINA.Plugins/LiveStack
                ;;
              plugin-ninaapi)
                git clone https://github.com/nitr57/ninaAPI NINA.Plugins/ninaAPI
                ;;
              plugin-orbuculum)
                git clone https://github.com/nitr57/nina.plugin.orbuculum NINA.Plugins/nina.plugin.orbuculum
                ;;
              plugin-phd2tools)
                git clone https://github.com/nitr57/nina.plugin.phd2tools NINA.Plugins/nina.plugin.phd2tools
                ;;
              plugin-groundstation)
                git clone https://github.com/nitr57/nina-ground-station NINA.Plugins/nina-ground-station
                ;;
              plugin-alpaca)
                git clone https://github.com/nitr57/nina.plugin.alpaca NINA.Plugins/nina.plugin.alpaca
                ;;
              plugin-nightsummary)
                git clone https://github.com/nitr57/nina.plugin.nightsummary NINA.Plugins/nina.plugin.nightsummary
                ;;
              plugin-polaralignment)
                git clone https://github.com/nitr57/nina.plugin.polaralignment NINA.Plugins/PolarAlignment
                ;;
              plugin-touch-n-stars)
                git clone --branch develop --single-branch https://github.com/nitr57/N.I.N.A-Plugin-for-Touch-N-Stars NINA.Plugins/Touch-N-Stars
                ;;
              plugin-luckycapture)
                git clone --branch main --single-branch https://github.com/acocalypso/pins.LuckyCapture NINA.Plugins/pins.LuckyCapture
                ;;
              plugin-pins)
                git clone https://github.com/nitr57/pins.plugin NINA.Plugins/pins.plugin
                ;;
              *)
                echo "Unknown plugin package key: $package_key" >&2
                return 1
                ;;
            esac
          }

          build_touch_frontend() {
            local plugin_dir="$1"
            local tmp_dir="$plugin_dir/frontend-build"

            rm -rf "$tmp_dir" "$plugin_dir/app"
            git clone --branch develop --single-branch https://github.com/Touch-N-Stars/Touch-N-Stars.git "$tmp_dir"
            pushd "$tmp_dir" >/dev/null
            npm install
            npm run build
            popd >/dev/null
            mv "$tmp_dir/dist" "$plugin_dir/app"
          }

          build_pins_sdks() {
            local plugin_dir_abs="$1"

            powerbox_sdk_tmp="$(mktemp -d)"
            git clone --recursive https://github.com/nitr57/pins.powerbox.sdk "$powerbox_sdk_tmp"
            pushd "$powerbox_sdk_tmp" >/dev/null
            mkdir -p build
            cd build
            cmake ..
            make
            mkdir -p "$plugin_dir_abs/extra-libs"
            find . -name 'libPowerBoxSDK.so' -exec cp {} "$plugin_dir_abs/extra-libs/PowerBoxSDK.dll" \;
            popd >/dev/null
            rm -rf "$powerbox_sdk_tmp"

            meteostation_sdk_tmp="$(mktemp -d)"
            git clone --recursive https://github.com/nitr57/pins.meteostation.sdk "$meteostation_sdk_tmp"
            pushd "$meteostation_sdk_tmp" >/dev/null
            mkdir -p build
            cd build
            cmake ..
            make
            mkdir -p "$plugin_dir_abs/extra-libs"
            find . -name 'libMeteoStationSDK.so' -exec cp {} "$plugin_dir_abs/extra-libs/MeteoStationSDK.dll" \;
            popd >/dev/null
            rm -rf "$meteostation_sdk_tmp"

            lenscontrol_sdk_tmp="$(mktemp -d)"
            git clone --recursive https://github.com/nitr57/pins.lenscontrol.sdk "$lenscontrol_sdk_tmp"
            pushd "$lenscontrol_sdk_tmp" >/dev/null
            mkdir -p build
            cd build
            cmake ..
            make
            mkdir -p "$plugin_dir_abs/extra-libs"
            find . -name 'libLensControlSDK.so' -exec cp {} "$plugin_dir_abs/extra-libs/LensControlSDK.dll" \;
            popd >/dev/null
            rm -rf "$lenscontrol_sdk_tmp"

            if [ ! -f "$plugin_dir_abs/extra-libs/PowerBoxSDK.dll" ]; then
              echo "CRITICAL: PowerBoxSDK.dll missing in extra-libs" >&2
              return 1
            fi
            if [ ! -f "$plugin_dir_abs/extra-libs/MeteoStationSDK.dll" ]; then
              echo "CRITICAL: MeteoStationSDK.dll missing in extra-libs" >&2
              return 1
            fi
            if [ ! -f "$plugin_dir_abs/extra-libs/LensControlSDK.dll" ]; then
              echo "CRITICAL: LensControlSDK.dll missing in extra-libs" >&2
              return 1
            fi
          }

          build_plugin_package() {
            local project_path="$1"
            local install_folder="$2"
            local deb_package="$3"
            local assembly_regex="$4"
            local needs_touch_frontend="$5"
            local needs_pins_sdks="$6"
            local runtime_dependencies="${7:-}"
            local source_args=()
            if [ "$deb_package" = "pins-plugin-luckycapture" ]; then
              source_args=(-p:PinsRoot="$(pwd)")
            fi

            local plugin_dir
            plugin_dir=$(dirname "$project_path")
            local plugin_dir_abs
            plugin_dir_abs="$(pwd)/$plugin_dir"

            if [ "$needs_touch_frontend" = "yes" ]; then
              build_touch_frontend "$plugin_dir"
            fi

            if [ "$needs_pins_sdks" = "yes" ]; then
              build_pins_sdks "$plugin_dir_abs"
            fi

            local assembly_info="$plugin_dir/Properties/AssemblyInfo.cs"
            if [ ! -f "$assembly_info" ]; then
              assembly_info=$(find "$plugin_dir" -name AssemblyInfo.cs | head -n 1)
            fi
            if [ -z "$assembly_info" ] || [ ! -f "$assembly_info" ]; then
              echo "AssemblyInfo.cs not found for ${deb_package}" >&2
              return 1
            fi

            local assembly_version_line
            if [ -n "$assembly_regex" ]; then
              assembly_version_line=$(grep -E "$assembly_regex" "$assembly_info" | head -n 1 || true)
            else
              assembly_version_line=$(grep -E '^\s*\[assembly:\s*AssemblyInformationalVersion' "$assembly_info" | head -n 1 || true)
            fi

            if [ -z "$assembly_version_line" ]; then
              assembly_version_line=$(grep -E '^\s*\[assembly:\s*AssemblyFileVersion' "$assembly_info" | head -n 1 || true)
            fi

            if [ -z "$assembly_version_line" ]; then
              assembly_version_line=$(grep -E '^\s*\[assembly:\s*AssemblyVersion' "$assembly_info" | head -n 1 || true)
            fi

            if [ -z "$assembly_version_line" ]; then
              assembly_version_line=$(grep -E 'AssemblyInformationalVersion|AssemblyFileVersion|AssemblyVersion' "$assembly_info" | head -n 1 || true)
            fi

            local plugin_version
            plugin_version=$(echo "$assembly_version_line" | sed -E 's/.*"([^"]+)".*/\1/' | head -n 1 | tr -d '\r\n')
            if [ -z "$plugin_version" ]; then
              echo "No supported assembly version attribute found in $assembly_info" >&2
              return 1
            fi

            plugin_version="${plugin_version}+${CI_BUILD_NUMBER}"

            dotnet restore "$project_path" -r "${TARGET_RUNTIME}" "${source_args[@]}"
            JavaPath=$(which java) dotnet build "$project_path" -c "${BUILD_CONFIGURATION}" -f "${PLUGIN_TARGET_FRAMEWORK}" -r "${TARGET_RUNTIME}" --no-restore ${PLUGIN_MSBUILD_ARGS} "${source_args[@]}"
            tfm_dir="$plugin_dir/bin/${BUILD_CONFIGURATION}/${PLUGIN_TARGET_FRAMEWORK}/${TARGET_RUNTIME}"
            if [ ! -d "$tfm_dir" ]; then
              build_root="$plugin_dir/bin/${BUILD_CONFIGURATION}"
              tfm_dir=$(find "$build_root" -maxdepth 1 -type d -name 'net*' | head -n 1)
              if [ -z "$tfm_dir" ]; then
                echo "Could not locate target framework output under $build_root" >&2
                return 1
              fi
            fi

            deb_root="${PLUGIN_DEB_BASE}/${deb_package}"
            install_root="$deb_root${PLUGINS_INSTALL_BASE}/${install_folder}"
            rm -rf "$deb_root"
            mkdir -p "$install_root"

            core_publish_dir="${PUBLISH_DIRECTORY}/${TARGET_RUNTIME}"
            if [ -d "$core_publish_dir" ]; then
              exclude_list="$(pwd)/core_excludes.txt"
              (cd "$core_publish_dir" && find . -type f -printf '%P\n') > "$exclude_list"
              rsync -a --exclude-from="$exclude_list" "$tfm_dir/" "$install_root/"
              rm -f "$exclude_list"
            elif [ "$deb_package" = "pins-plugin-luckycapture" ]; then
              # All LuckyCapture references are provided by PINS. Do not ship
              # duplicate core assemblies when building a plugin by itself.
              rsync -a --include='/PINS.LuckyCapture.*' --exclude='*' "$tfm_dir/" "$install_root/"
            else
              echo "Core publish directory not found at $core_publish_dir; packaging plugin without core file exclusion."
              rsync -a "$tfm_dir/" "$install_root/"
            fi

            find "$install_root" -mindepth 1 -maxdepth 1 -type d -name '??-??' -exec rm -rf {} +
            find "$install_root" -mindepth 1 -maxdepth 1 -type d -name '??' -exec rm -rf {} +

            extra_libs="$plugin_dir/extra-libs"
            if [ -d "$extra_libs" ]; then
              find "$extra_libs" -maxdepth 1 -type f -name '*.dll' -exec cp {} "$install_root/" \;
            fi

            app_dir="$plugin_dir/app"
            if [ -d "$app_dir" ]; then
              rm -rf "$install_root/app"
              cp -a "$app_dir" "$install_root/app"
            fi

            control_dir="$deb_root/DEBIAN"
            mkdir -p "$control_dir"
            installed_size=$(du -sk "$deb_root${PLUGINS_INSTALL_BASE}" | cut -f1)

            {
              echo "Package: ${deb_package}"
              echo "Version: ${plugin_version}"
              echo "Section: misc"
              echo "Priority: optional"
              echo "Architecture: ${DEB_ARCH}"
              echo "Maintainer: PINS Team"
              echo "Installed-Size: ${installed_size}"
              echo "Description: NINA plugin package for ${install_folder}"
              if [ -n "$runtime_dependencies" ]; then echo "Depends: $runtime_dependencies"; fi
            } > "$control_dir/control"

            {
              echo '#!/bin/sh'
              echo 'set -e'
              echo "chown pi:pi $(dirname ${PLUGINS_INSTALL_BASE}) || true"
              echo "chown pi:pi ${PLUGINS_INSTALL_BASE} || true"
              echo "chown -R pi:pi \"${PLUGINS_INSTALL_BASE}/${install_folder}\" || true"
              echo 'exit 0'
            } > "$control_dir/postinst"
            chmod 755 "$control_dir/postinst"

            deb_path="${PLUGIN_ARTIFACT_DIR}/${deb_package}_${plugin_version}_${DEB_ARCH}_${RELEASE_DATE}.deb"
            dpkg-deb --root-owner-group --build "$deb_root" "$deb_path"
            sha256sum "$deb_path" > "$deb_path.sha256"

            echo "$deb_path" >> artifacts/release-files.txt
            echo "$deb_path.sha256" >> artifacts/release-files.txt
          }

          case "$package_key" in
            pins)
              build_pins_package
              ;;
            pinsdaemon)
              build_pinsdaemon_package
              ;;
            pins-wandereretasdk)
              build_wandereretasdk_package
              ;;
            pins-wanderercoversdk)
              build_wanderercoversdk_package
              ;;
            pins-wandererrotatorsdk)
              build_wandererrotatorsdk_package
              ;;
            pins-nitecrawlersdk)
              build_nitecrawlersdk_package
              ;;
            plugin-joko)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/joko.nina.plugins/Joko.NINA.Plugins/Joko.NINA.Plugins.HocusFocus/Joko.NINA.Plugins.HocusFocus.csproj" "joko.nina.plugins" "pins-plugin-joko" "" "no" "no"
              ;;
            plugin-orbitals)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/NINA.Joko.Plugin.Orbitals/NINA.Joko.Plugin.Orbitals/NINA.Joko.Plugin.Orbitals.csproj" "Orbitals" "pins-plugin-orbitals" "^\s*\[assembly:\s*AssemblyVersion" "no" "no"
              ;;
            plugin-tenmicron)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/NINA.Joko.Plugin.TenMicron/NINA.Joko.Plugin.TenMicron/NINA.Joko.Plugin.TenMicron.csproj" "NINA.Joko.Plugin.TenMicron" "pins-plugin-tenmicron" "^\s*\[assembly:\s*AssemblyVersion" "no" "no"
              ;;
            plugin-livestack)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/LiveStack/nina.plugin.livestack.csproj" "LiveStack" "pins-plugin-livestack" "" "no" "no"
              ;;
            plugin-ninaapi)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/ninaAPI/ninaAPI/ninaAPI.csproj" "ninaAPI" "pins-plugin-ninaapi" "" "no" "no"
              ;;
            plugin-orbuculum)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/nina.plugin.orbuculum/Orbuculum/Orbuculum.csproj" "Orbuculum" "pins-plugin-orbuculum" "^\s*\[assembly:\s*AssemblyVersion" "no" "no"
              ;;
            plugin-phd2tools)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/nina.plugin.phd2tools/nina.plugin.phd2tools.csproj" "Phd2 Tools" "pins-plugin-phd2tools" "^\s*\[assembly:\s*AssemblyVersion" "no" "no"
              ;;
            plugin-groundstation)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/nina-ground-station/Ground Station.csproj" "GroundStation" "pins-plugin-groundstation" "^\s*\[assembly:\s*AssemblyVersion" "no" "no"
              ;;
            plugin-alpaca)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/nina.plugin.alpaca/nina.plugin.alpaca.csproj" "Alpaca" "pins-plugin-alpaca" "" "no" "no"
              ;;
            plugin-nightsummary)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/nina.plugin.nightsummary/NINA.Plugin.NightSummary/NINA.Plugin.NightSummary.csproj" "NINA.Plugin.NightSummary" "pins-plugin-nightsummary" "" "no" "no"
              ;;
            plugin-polaralignment)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/PolarAlignment/PolarAlignment/NINA.Plugins.PolarAlignment.csproj" "PolarAlignment" "pins-plugin-polaralignment" "" "no" "no"
              ;;
            plugin-touch-n-stars)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/Touch-N-Stars/Touch-N-Stars/Touch-N-Stars.csproj" "Touch-N-Stars" "pins-plugin-touch-n-stars" "" "yes" "no"
              ;;
            plugin-luckycapture)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/pins.LuckyCapture/src/PINS.LuckyCapture/PINS.LuckyCapture.csproj" "PINS.LuckyCapture" "pins-plugin-luckycapture" "" "no" "no" "pins (>= 3.3.0.1066), ffmpeg"
              ;;
            plugin-pins)
              clone_selected_plugin_repo
              build_plugin_package "NINA.Plugins/pins.plugin/PI'N'Stars.csproj" "pins.plugin" "pins-plugin-pins" "^\s*\[assembly:\s*AssemblyVersion" "no" "yes"
              ;;
            *)
              echo "Unsupported package key: $package_key" >&2
              exit 1
              ;;
          esac

          if [ ! -s artifacts/release-files.txt ]; then
            echo "No package artifacts found for $package_key" >&2
            exit 1
          fi

          {
            echo "release_files<<EOF"
            cat artifacts/release-files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish package GitHub release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: Release ${{ steps.meta.outputs.release_tag }}
          body: |
            Automated release for package ${{ inputs.package_key }}.
            Build number starts at 300 by using offset run numbering.
          files: ${{ steps.build.outputs.release_files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload package build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.package_key }}-debs
          path: ${{ steps.build.outputs.release_files }}
          retention-days: 30
