          deb_package="pins-plugin-pins"
          plugin_dir=$(dirname "$project_path")
          # Convert plugin_dir to absolute path to avoid issues inside pushd/popd
          plugin_dir_abs="$(pwd)/$plugin_dir"
          
          set +e
          (
            set -euo pipefail

            # Build pins.powerbox.sdk
            echo "Building pins.powerbox.sdk..."
            powerbox_sdk_tmp="$(mktemp -d)"
            git clone --recursive https://github.com/nitr57/pins.powerbox.sdk "$powerbox_sdk_tmp"
            pushd "$powerbox_sdk_tmp" >/dev/null
            mkdir -p build && cd build
            cmake ..
            make
            mkdir -p "$plugin_dir_abs/extra-libs"
            echo "Listing build directory contents for pins.powerbox.sdk:"
            ls -l
            echo "Copying to $plugin_dir_abs/extra-libs/PowerBoxSDK.dll"
            # Use find to locate the .so file regardless of exact name prefix/suffix
            find . -name "libPowerBoxSDK.so" -exec cp {} "$plugin_dir_abs/extra-libs/PowerBoxSDK.dll" \;
            if [ ! -f "$plugin_dir_abs/extra-libs/PowerBoxSDK.dll" ]; then
                echo "Error: PowerBoxSDK.dll was not created!"
                exit 1
            fi
