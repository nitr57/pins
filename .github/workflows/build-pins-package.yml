      - name: Summarize plugin build status
        if: always()
        run: |
          if [ -s "${{ env.PLUGIN_FAILURES_FILE }}" ]; then
            echo "The following plugin packages failed to build:" >&2
            cat "${{ env.PLUGIN_FAILURES_FILE }}" >&2
            exit 1
          fi
          echo "All plugin packages built successfully."

      - name: Create firmware bundle zip
        id: firmware_bundle
        shell: bash
        run: |
          set -euo pipefail

          release_date="${{ steps.release_tag.outputs.date }}"
          release_time="$(date +%H%M%S)"
          bundle_name="firmware_${release_date}_${release_time}.zip"
          bundle_path="artifacts/$bundle_name"

          shopt -s nullglob
          files=(
            "artifacts/${{ env.DEB_PACKAGE }}_${{ steps.version.outputs.package_version }}_${{ env.DEB_ARCH }}_${{ steps.release_tag.outputs.date }}.deb"
            "artifacts/${{ env.DEB_PACKAGE }}_${{ steps.version.outputs.package_version }}_${{ env.DEB_ARCH }}_${{ steps.release_tag.outputs.date }}.deb.sha256"
            artifacts/pinsdaemon_*.deb
            artifacts/pinsdaemon_*.deb.sha256
            artifacts/pins-wandereretasdk_*.deb
            artifacts/pins-wandereretasdk_*.deb.sha256
            artifacts/plugins/*.deb
            artifacts/plugins/*.deb.sha256
          )

          if [ ${#files[@]} -eq 0 ]; then
            echo "No package artifacts found to include in firmware bundle." >&2
            exit 1
          fi

          rm -f "$bundle_path"
          zip -j "$bundle_path" "${files[@]}"

          echo "Created firmware bundle: $bundle_path"
          echo "path=$bundle_path" >> "$GITHUB_OUTPUT"

      - name: Publish deb-only GitHub release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ steps.release_tag.outputs.value }}
          name: Release ${{ steps.release_tag.outputs.value }}
          body: |
            Automated release ${{ steps.release_tag.outputs.value }} containing the Raspberry Pi build and plugin Debian packages.
          files: |
            artifacts/${{ env.DEB_PACKAGE }}_${{ steps.version.outputs.package_version }}_${{ env.DEB_ARCH }}_${{ steps.release_tag.outputs.date }}.deb
            artifacts/pinsdaemon_*.deb
            artifacts/pinsdaemon_*.deb.sha256
            artifacts/pins-wandereretasdk_*.deb
            artifacts/plugins/*.deb
            ${{ steps.firmware_bundle.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload plugin deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugin-debs
          path: ${{ env.PLUGIN_ARTIFACT_DIR }}
          retention-days: 30
